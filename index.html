<!DOCTYPE html>
<html lang="tr">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no">

  <title>Paralel Levhalar - Elektrik Alanı</title>

  <!-- A-FRAME -->
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>

  <!-- AR.JS -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.5/aframe/build/aframe-ar.js"></script>

</head>


<body style="
  margin:0;
  overflow:hidden;
  background:black;
">


<a-scene
  embedded
  renderer="antialias: true; colorManagement: true"
  arjs="
    sourceType: webcam;
    debugUIEnabled: false;
    trackingMethod: best;
  "
>


  <!-- ================================================= -->
  <!-- HIRO MARKER -->
  <!-- ================================================= -->

  <a-marker preset="hiro">


    <!-- ================================================= -->
    <!-- POZİTİF LEVHA -->
    <!-- ================================================= -->

    <a-box
      position="-1.45 0 0"
      width="0.12"
      height="2.6"
      depth="3.2"
      color="#d62828"
      material="
        metalness:0.75;
        roughness:0.25;
      ">
    </a-box>


    <!-- Pozitif levhanın iç yüzeyi -->
    <a-box
      position="-1.375 0 0"
      width="0.025"
      height="2.5"
      depth="3.1"
      color="#ff5252">
    </a-box>


    <!-- ================================================= -->
    <!-- NEGATİF LEVHA -->
    <!-- ================================================= -->

    <a-box
      position="1.45 0 0"
      width="0.12"
      height="2.6"
      depth="3.2"
      color="#1565c0"
      material="
        metalness:0.75;
        roughness:0.25;
      ">
    </a-box>


    <!-- Negatif levhanın iç yüzeyi -->
    <a-box
      position="1.375 0 0"
      width="0.025"
      height="2.5"
      depth="3.1"
      color="#42a5f5">
    </a-box>



    <!-- ================================================= -->
    <!-- LEVHA KENAR ÇERÇEVELERİ -->
    <!-- ================================================= -->

    <!-- + levha üst -->
    <a-box
      position="-1.45 1.30 0"
      width="0.16"
      height="0.08"
      depth="3.25"
      color="#ff6b6b">
    </a-box>

    <!-- + levha alt -->
    <a-box
      position="-1.45 -1.30 0"
      width="0.16"
      height="0.08"
      depth="3.25"
      color="#ff6b6b">
    </a-box>


    <!-- - levha üst -->
    <a-box
      position="1.45 1.30 0"
      width="0.16"
      height="0.08"
      depth="3.25"
      color="#64b5f6">
    </a-box>

    <!-- - levha alt -->
    <a-box
      position="1.45 -1.30 0"
      width="0.16"
      height="0.08"
      depth="3.25"
      color="#64b5f6">
    </a-box>



    <!-- ================================================= -->
    <!-- + İŞARETİ -->
    <!-- ================================================= -->

    <a-text
      value="+"
      color="white"
      align="center"
      width="1.5"
      position="-1.37 0 1.63"
      rotation="0 0 0">
    </a-text>


    <!-- ================================================= -->
    <!-- - İŞARETİ -->
    <!-- ================================================= -->

    <a-text
      value="−"
      color="white"
      align="center"
      width="1.5"
      position="1.37 0 1.63"
      rotation="0 0 0">
    </a-text>



    <!-- ================================================= -->
    <!-- ELEKTRİK ALANI -->
    <!-- ================================================= -->

    <a-entity id="electricField"></a-entity>



    <!-- ================================================= -->
    <!-- ALAN ETİKETİ -->
    <!-- ================================================= -->

    <a-text
      value="ELEKTRİK ALANI"
      color="#00ffff"
      align="center"
      width="2.5"
      position="0 1.65 0"
      rotation="0 0 0">
    </a-text>


  </a-marker>


  <!-- ================================================= -->
  <!-- KAMERA -->
  <!-- ================================================= -->

  <a-entity camera></a-entity>


</a-scene>



<script>


const field =
  document.querySelector("#electricField");


// =====================================================
// AYARLAR
// =====================================================

const leftPlate  = -1.36;
const rightPlate =  1.36;

const lineLength =
  rightPlate - leftPlate;


// =====================================================
// ELEKTRİK ALAN ÇİZGİSİ OLUŞTUR
// =====================================================

function createElectricFieldLine(y, z) {


  const points = [];

  const segments = 40;


  // ---------------------------------------------
  // ÇİZGİ NOKTALARI
  // ---------------------------------------------

  for(let i = 0; i <= segments; i++) {

    const t =
      i / segments;


    const x =
      leftPlate +
      lineLength * t;


    points.push(

      new THREE.Vector3(
        x,
        y,
        z
      )

    );

  }



  // ---------------------------------------------
  // BEYAZ ELEKTRİK ALAN ÇİZGİSİ
  // ---------------------------------------------

  const geometry =
    new THREE.BufferGeometry()
      .setFromPoints(points);


  const material =
    new THREE.LineBasicMaterial({

      color: "#ffffff",

      transparent: true,

      opacity: 0.95

    });


  const line =
    new THREE.Line(
      geometry,
      material
    );


  field.object3D.add(line);



  // =================================================
  // OK
  // =================================================

  const arrowIndex = 23;


  const p1 =
    points[arrowIndex - 1];


  const p2 =
    points[arrowIndex];


  const direction =
    new THREE.Vector3()
      .subVectors(p2, p1)
      .normalize();



  const arrow =
    document.createElement("a-cone");


  arrow.setAttribute(
    "radius-bottom",
    "0.055"
  );


  arrow.setAttribute(
    "radius-top",
    "0"
  );


  arrow.setAttribute(
    "height",
    "0.18"
  );


  arrow.setAttribute(
    "color",
    "#ffff00"
  );


  arrow.setAttribute(
    "position",
    `${p2.x} ${p2.y} ${p2.z}`
  );


  // ---------------------------------------------
  // OKU ELEKTRİK ALANI YÖNÜNE ÇEVİR
  // ---------------------------------------------

  const quaternion =
    new THREE.Quaternion();


  quaternion.setFromUnitVectors(

    new THREE.Vector3(
      0,
      1,
      0
    ),

    direction

  );


  arrow.object3D.quaternion.copy(
    quaternion
  );


  field.appendChild(arrow);

}



// =====================================================
// ÇİZGİLERİ OLUŞTUR
// =====================================================
//
// Dikey ve derinlik boyunca düzenli dağıtılır.
//
// + LEVHA
//    |
//    |  → → → → → → →
//    |  → → → → → → →
//    |  → → → → → → →
//    |
// - LEVHA
//
// =====================================================


const verticalLines = 9;

const depthLines = 9;


for(let i = 0; i < verticalLines; i++) {


  const y =
    -1.05 +
    (2.1 / (verticalLines - 1)) * i;


  for(let j = 0; j < depthLines; j++) {


    const z =
      -1.25 +
      (2.5 / (depthLines - 1)) * j;


    createElectricFieldLine(
      y,
      z
    );

  }

}



// =====================================================
// MERKEZDE "E" ALAN VEKTÖRÜ
// =====================================================

const centerArrow =
  document.createElement("a-cone");


centerArrow.setAttribute(
  "radius-bottom",
  "0.075"
);


centerArrow.setAttribute(
  "radius-top",
  "0"
);


centerArrow.setAttribute(
  "height",
  "0.25"
);


centerArrow.setAttribute(
  "color",
  "#00ff00"
);


centerArrow.setAttribute(
  "position",
  "0 0 0"
);


// Cone'u X yönüne çevir
centerArrow.object3D.rotation.z =
  -Math.PI / 2;


field.appendChild(
  centerArrow
);



// =====================================================
// E VEKÖRÜ YAZISI
// =====================================================

const eText =
  document.createElement("a-text");


eText.setAttribute(
  "value",
  "E"
);


eText.setAttribute(
  "color",
  "#00ff00"
);


eText.setAttribute(
  "width",
  "0.8"
);


eText.setAttribute(
  "align",
  "center"
);


eText.setAttribute(
  "position",
  "0 0.25 0"
);


field.appendChild(
  eText
);



</script>

</body>

</html>
